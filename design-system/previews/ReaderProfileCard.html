<!doctype html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap"><link rel="stylesheet" href="../tokens/tokens.css"><link rel="stylesheet" href="../components/components.css"><script>var t = new URLSearchParams(location.search).get("theme"); if (t) document.documentElement.dataset.theme = t;</script><title>ReaderProfileCard — preview</title></head>
<body>
<div style="padding: 16px">
  <article class="ts-card ts-profile">
    <div class="ts-profile__head">
      <div class="ts-profile__avatar"><img class="ts-only-light" src="../assets/logo/symbol-on-light.svg" alt=""><img class="ts-only-dark" src="../assets/logo/symbol-on-dark.svg" alt=""></div>
      <div>
        <h3 class="ts-profile__title">Reader Profile</h3>
        <p class="ts-profile__subtitle">Marina Costa · 48 books read</p>
        <div class="ts-profile__toggles">
          <button class="ts-toggle" role="switch" aria-checked="true" aria-label="Follow updates"><span class="ts-toggle__track"></span></button>
          <button class="ts-toggle" role="switch" aria-checked="false" aria-label="Show on profile"><span class="ts-toggle__track"></span></button>
        </div>
      </div>
    </div>
    <div class="ts-profile__actions">
      <button class="ts-btn ts-btn--primary ts-btn--sm">Primary</button>
      <button class="ts-btn ts-btn--secondary ts-btn--sm">Secondary</button>
    </div>
  </article>
</div>
</body>
</html>
